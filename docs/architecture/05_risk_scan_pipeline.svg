<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 782">
  <title>Portfolio Risk Scan Pipeline</title>
  <desc>Async bulk scan: CSV upload, chunked scoring, tier counters, indexed results, pagination, streaming export, case promotion.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1400" height="782" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1400" height="46" rx="8" fill="#0F172A"/>
  <rect x="0" y="34" width="1400" height="12" fill="#0F172A"/>
  <text x="700" y="30" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#F1F5F9">Portfolio Risk Scan Pipeline</text>
  <rect x="10" y="58" width="1380" height="100" rx="4" fill="#EFF6FF"/>
  <text x="20" y="77" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#1D4ED8" letter-spacing="1.4">UPLOAD &amp; VALIDATION</text>
  <rect x="10" y="168" width="1380" height="100" rx="4" fill="#FEF3C7"/>
  <text x="20" y="187" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#92400E" letter-spacing="1.4">ASYNC PROCESSING</text>
  <rect x="10" y="278" width="1380" height="100" rx="4" fill="#FFF1F2"/>
  <text x="20" y="297" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#BE123C" letter-spacing="1.4">SCORING</text>
  <rect x="10" y="388" width="1380" height="100" rx="4" fill="#F0FDF4"/>
  <text x="20" y="407" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#15803D" letter-spacing="1.4">PERSISTENCE</text>
  <rect x="10" y="498" width="1380" height="100" rx="4" fill="#ECFEFF"/>
  <text x="20" y="517" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#0E7490" letter-spacing="1.4">RESULTS ACCESS</text>
  <rect x="10" y="608" width="1380" height="98" rx="4" fill="#FFFBEB"/>
  <text x="20" y="627" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#B45309" letter-spacing="1.4">OUTPUT PATHS</text>
  <rect x="120" y="88" width="500" height="58" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="370" y="112" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#1E40AF">CSV Upload</text>
  <text x="370" y="128" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#1E40AF" opacity="0.85">POST /risk-scan · HTTP 202 + scan_id returned</text>
  <rect x="780" y="88" width="500" height="58" rx="6" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1030" y="112" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#3B0764">Schema Validation</text>
  <text x="1030" y="128" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#3B0764" opacity="0.85">Field types · required columns · row sanitisation</text>
  <rect x="120" y="198" width="500" height="58" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="370" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#451A03">Async Scan Job</text>
  <text x="370" y="238" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#451A03" opacity="0.85">Background task · scan_id persisted · scan_id polling</text>
  <rect x="780" y="198" width="500" height="58" rx="6" fill="#A5F3FC" stroke="#0891B2" stroke-width="1.5"/>
  <text x="1030" y="222" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#083344">Chunked Processing</text>
  <text x="1030" y="238" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#083344" opacity="0.85">2,000-row chunks · memory-bounded per chunk</text>
  <rect x="10" y="308" width="680" height="58" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="350" y="332" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#7F1D1D">4-Layer Scoring</text>
  <text x="350" y="348" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7F1D1D" opacity="0.85">Model + rules + behavioural + graph per row</text>
  <rect x="710" y="308" width="680" height="58" rx="6" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text x="1050" y="332" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#7C2D12">Tier Assignment</text>
  <text x="1050" y="348" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7C2D12" opacity="0.85">P0 Critical · P1 High · P2 Medium · P3 Low</text>
  <rect x="10" y="418" width="680" height="58" rx="6" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text x="350" y="442" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#064E3B">Running Summary Counters</text>
  <text x="350" y="458" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#064E3B" opacity="0.85">P0–P3 counts · exposure totals updated per chunk</text>
  <rect x="710" y="418" width="680" height="58" rx="6" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text x="1050" y="442" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#064E3B">Indexed Scan Results</text>
  <text x="1050" y="458" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#064E3B" opacity="0.85">Composite index (scan_id, risk_score, tier)</text>
  <rect x="400" y="528" width="600" height="58" rx="6" fill="#A5F3FC" stroke="#0891B2" stroke-width="1.5"/>
  <text x="700" y="552" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#083344">Progress Polling</text>
  <text x="700" y="568" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#083344" opacity="0.85">GET /risk-scan/{scan_id}/status · real-time incremental</text>
  <rect x="10" y="638" width="400" height="56" rx="6" fill="#A5F3FC" stroke="#0891B2" stroke-width="1.5"/>
  <text x="210" y="661" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#083344">Paginated Results</text>
  <text x="210" y="677" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#083344" opacity="0.85">GET /risk-scan/{id}/results · P0/P1/P3 filter</text>
  <rect x="490" y="638" width="400" height="56" rx="6" fill="#A5F3FC" stroke="#0891B2" stroke-width="1.5"/>
  <text x="690" y="661" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#083344">Streaming CSV Export</text>
  <text x="690" y="677" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#083344" opacity="0.85">GET /risk-scan/{id}/export · server-side cursor</text>
  <rect x="970" y="638" width="420" height="56" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="1180" y="661" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#451A03">Promote to Case</text>
  <text x="1180" y="677" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#451A03" opacity="0.85">Individual row → Case Dossier · Review Queue</text>
  <rect x="10" y="716" width="1380" height="50" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="700" y="735" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B" font-weight="600">Hosted Profile B (Render) supports bounded inspection scans. 10M-row benchmark evidence is from controlled local environment benchmark runs.</text>
  <text x="700" y="753" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9CA3AF">The hosted environment validates async architecture, progress polling, pagination, and export. Full benchmark replication requires the local Docker Compose stack.</text>
  <line x1="370" y1="146" x2="370" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="1030" y1="146" x2="1030" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M370,256 C370,282 350,294 350,308" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M1030,256 C1030,282 1050,294 1050,308" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <line x1="350" y1="366" x2="350" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="1050" y1="366" x2="1050" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M1050,476 C1050,502 700,502 700,528" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M350,476 C350,540 210,584 210,638" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M1050,476 C1050,530 1050,580 1050,612 C1050,632 690,608 690,638" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M1050,476 C1180,530 1180,590 1180,638" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
</svg>
