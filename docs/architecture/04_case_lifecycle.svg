  <path d="M430,256 C430,282 430,296 430,308" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M970,256 C970,282 970,296 970,308" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <line x1="660" y1="337" x2="740" y2="337" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M970,366 C970,378 300,378 300,390" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M970,366 C970,378 820,378 820,390" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
