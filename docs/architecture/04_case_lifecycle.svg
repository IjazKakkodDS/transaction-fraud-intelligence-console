  <path d="M820,452 C820,478 430,478 430,504" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <line x1="660" y1="535" x2="740" y2="535" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
